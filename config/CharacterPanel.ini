[Animation]
; non_combat_loop (default) or mt_idle. Restart the game after changing.
UnarmedIdle=non_combat_loop

[Diagnostics]
; Opt-in correlated OAR/load/DAC/capture/mount and pose evidence. Restart after changing.
; Pose limit: 4 windows / 24 snapshots per request; fixed source bones once per request.
DetailedAnimationTrace=false
; Independent opt-in source graph identities/counts only; no graph creation or drive.
; At most 16 grouped lines per actor/request. Restart after changing.
BehaviorGraphProbe=false

[Experiment]
; off (default), construct (empty shell), load (shell plus native project load),
; drive (G2: load plus one engine activation and 120 fixed 1/60 s updates),
; inject (drive plus a pre-registered event dispatch through the engine's own
; event-triggered-transition entry before the first pipeline step).
; Independent-graph experiment: runs once per process on the first panel open.
; Restart after changing.
IndependentGraph=off
; v27 (default off): when on and a candidate is retained, the panel applies that candidate's
; poseLocal instead of the OAR clip sampler. DisplayStep=false keeps the final driven pose.
DisplayPose=false
; Opt-in AE 1.6.1170 inject: elapsed 60 Hz scheduling of shared fixed 1/60 s steps.
; Each display call counts at most 100 ms / 6 steps; excess stall time is discarded,
; fractional time is retained, and zero-due calls keep the current stepped-mode pose.
; Requires DisplayPose=true and the same source generation/controller owner. Stale views use OAR;
; other ineligible steps may keep that valid source's frozen pose. Request/retarget/rejection
; and ineligible/frozen fallback reset pacing; F8-only gaps use the bounded stall rule.
; Restart after changing.
DisplayStep=false
; G3-A (default off): outside the panel F7 requests a fresh 20-second / 800-line window,
; resetting its baseline, settle state and budget. Inside the panel F7 still recaptures.
; Only settled word-variable and active-node count changes are logged, read-only.
; Source loss/replacement or PreLoadGame/NewGame cancels the window; explicitly F7 again
; after the source is ready. Detected source changes abort instead of auto-rebasing.
SourceTimeline=false
