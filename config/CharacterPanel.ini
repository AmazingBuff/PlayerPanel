[Animation]
; non_combat_loop (default) or mt_idle. Restart the game after changing.
UnarmedIdle=non_combat_loop

[Diagnostics]
; Opt-in correlated OAR/load/DAC/capture/mount and pose evidence. Restart after changing.
; Pose limit: 4 windows / 24 snapshots per request; fixed source bones once per request.
DetailedAnimationTrace=false
; Independent opt-in source graph identities/counts only; no graph creation or drive.
; At most 16 grouped lines per actor/request. Restart after changing.
BehaviorGraphProbe=false

[Experiment]
; off (default), construct (empty shell), load (shell plus native project load),
; drive (G2: load plus one engine activation and 120 fixed 1/60 s updates),
; inject (drive plus a pre-registered event dispatch through the engine's own
; event-triggered-transition entry before the first pipeline step).
; Independent-graph experiment: runs once per process on the first panel open.
; Schema 2 observes completed Generate outputs; equip stays 120 commanded advances.
; Exact clip clocks and fresh pose histories are scoped by equip/unequip segment.
; Restart after changing.
IndependentGraph=off
; v27 (default off): when on and a candidate is retained, the panel applies that candidate's
; poseLocal instead of the OAR clip sampler. DisplayStep=false keeps the final driven pose.
DisplayPose=false
; Opt-in AE 1.6.1170 inject: elapsed 60 Hz scheduling of shared fixed 1/60 s steps.
; Each display call counts at most 100 ms / 6 steps; excess stall time is discarded,
; fractional time is retained, and zero-due calls keep the current stepped-mode pose.
; Requires DisplayPose=true and the same source generation/controller owner. Stale views use OAR;
; other ineligible steps may keep that valid source's frozen pose. Request/retarget/rejection
; and ineligible/frozen fallback reset pacing; F8-only gaps use the bounded stall rule.
; Restart after changing.
DisplayStep=false
; G3-A (default off): outside the panel F7 requests a fresh 20-second / 800-line window,
; resetting its baseline, settle state and budget. Inside the panel F7 still recaptures.
; Only settled word-variable and active-node count changes are logged, read-only.
; Source loss/replacement or PreLoadGame/NewGame cancels the window; explicitly F7 again
; after the source is ready. Detected source changes abort instead of auto-rebasing.
SourceTimeline=false
; G5-E3 v2 (default empty): which managed non-1stperson graph the `on` timeline observes, by
; project name (case-insensitive, exact length). Empty keeps the legacy rule - the last managed
; non-1stperson graph - which picked the wrong object on 2026-11-10 (463/36 against the candidate
; source's 652/106). Each on window prints a graph-census line listing every managed graph
; with its project name, word count and active-node count, so the name can be read off a first
; attempt. Ignored in `concurrent` mode, which observes the pinned graph.
SourceTimelineGraph=
; G5-E4 (default off): capture the source graph poseLocal and clip clocks while an `on` window
; runs. Snapshots are taken at settle anchors (one per settle, the first sample after it) and
; clock samples every 10 frames; the read happens after the frame apply, so poseLocal is the
; completed output. Requires SourceTimeline=on and is mutually exclusive with SamplingLiveness.
; Budgets: 8 snapshots, 120 clock rows, 1500 lines; any drop is reported on the window-closed row.
SourcePoseCapture=false
; C-G3B-E3 (default off): transient mode for the source timeline. When on with
; SourceTimeline, BOOL/INT-typed variables log every observed word change immediately
; (no settle rule), catching one-frame command writes the settle-3 rule filters out;
; REAL/quad types keep settle-3. Requires SourceTimeline=true and IndependentGraph=off.
SourceTransientWatch=false
; C-VC1 (default off): one-shot read-only census of the candidate's behaviour-graph variable
; table (index, m_type, role, flags, name, current word, initial value, bounds), the source's
; same table, and a by-name alignment of the two. Requires IndependentGraph != off; runs once
; per process after the candidate loads. Writes nothing, adds no hook and calls no native code.
; The name/type table is bounded by the type table (<= 8192 entries); slot indices are not
; comparable between projects, so only names pair the two sides.
CandidateVariableCensus=false
; C-G3B-S1 (default off): after the candidate activates, write iRightHandEquipped=1 once through
; the graph's own SetGraphVariableInt (CommonLib member, no new REL entry) and sample iState /
; currentDefaultState / the node count at a labelled baseline and each completed Generate.
; Schema 2 includes segment/completed counters. Requires IndependentGraph=drive
; or inject. One write and one probe per process; a failed setter is logged and never retried or
; replaced with a direct word write.
CandidateInputProbe=false
; C-G3B-S2: which single variable the probe writes, and the integer value it writes. The setter
; follows the variable's own m_type (BOOL -> bool setter, INT8/16/32 -> int setter); REAL, pointer
; and quad-sized targets are skipped rather than written lossily. Leave the name empty to run the
; probe as observation only (no write) — that is how an event-only run such as inject is judged.
CandidateInputVariable=IsEquipping
CandidateInputValue=1
; C-G5-CAL D2 (default off): before the inject dispatch, write the three equipment words the
; source observed during a real 1H equip (iMagicEquipped=1, iRightHandEquipped=1,
; iLeftHandEquipped=9). Requires IndependentGraph=inject; a missing/unsupported/failed write
; skips the event and is logged. Calibration diagnostic only.
CandidateEquipPrime=false
; C-G5-CAL D3 (default off): with CandidateEquipPrime=true, additionally write the source
; branch words captured at window-open (iRightHandType=1, iLeftHandType=9). Kept separate so
; the D2 three-word profile remains reproducible. Requires IndependentGraph=inject.
CandidateEquipPrimeBranch=false
; C-G3B-S1 (default off): drive mode only runs the engine's generation entry when this is on.
; Without it the batch drives 120 steps on a graph that never generates (children-flag=0, all
; pose hashes equal), so a static candidate cannot judge any input. inject mode implies the entry.
CandidateGenerationEntry=false
; C-G3B-S3 (default off): once the equip phase settles (currentDefaultState==1 held for three
; consecutive post-Generate samples inside the first 120 driven steps), dispatch the configured
; event once through the same resolve+dispatch path. Schema 2 caps unequip at 180 advances:
; completed requires an observed state 12 followed by post-Generate state 0; otherwise timeout
; or invalid, never an assumed clip-end event. Requires IndependentGraph=inject. One full sequence
; per process; a no-settle window or a missing event name ends the run instead of retrying or
; upgrading to a timed injection. No variable is written.
CandidateUnequipProbe=false
; Override the candidate's native unequip event. Empty uses the verified Unequip event.
CandidateUnequipEvent=
; C-G4-A: while native candidate activity is armed (experiment drive windows, display
; stepping, pre-registered event dispatches), count OAR condition-evaluation detour hits
; against the candidate window and emit OAR CONTEXT rows plus the display-branch
; suppression row. Default off; restart after changing.
OarContextWatch=false
; C-G5-E1 (default off): sampling/application entry liveness; full E1 evidence remains pending.
; Three states: off | on | concurrent. It installs two read-only detours, 63589 (sampling
; entry, head 40 56 57 41 56) and 63856 (scene-application entry, head 48 81 EC 88 00 00 00);
; head mismatch is logged; partial installation cannot arm a window. It never writes
; engine fields, never compares poses and cannot by itself close G5 gate 1.
; `on`: outside the panel F7 opens one 20-second window; requires IndependentGraph=off.
; `concurrent`: the candidate experiment pins its own source graph and arms the window before
; its dispatches; first stepped display close starts a 10-second resumed segment. Expiry, a
; second close or world reset requests final drain. Requires inject + DisplayPose.
; SamplingLiveness is exclusive with SourceTimeline=on. One window per process; restart to
; re-run. The close row carries entries by caller (engine local loop 0xba3f6e / plugin / other),
; pinned-source sample/apply entries (not output completion), pairing/loss/close accounting, and
; queue pointer/mode byte, frames, and every drop counter.
SamplingLiveness=off
; C-G5-CAL K3-C (default off): with IndependentGraph=inject, write the per-generation full
; candidate snapshot (all poseLocal tracks, raw float32 bits, two reads per generation, clip metadata)
; to CharacterPanel-g5k3-*.bin in the SKSE log directory. Bounded to 512 records; a failure
; invalidates the observation segment.
ObservationSnapshot=false
; C-G5-CAL K1 identity census (default off): one-shot read-only dump of the graph
; identity, full skeleton (bone names/parents/reference pose) and every active clip's
; resource identity (animation header + spline data/blockOffsets hashes + binding map +
; process-local stable id) on the source and candidate, plus the equip/unequip clip
; sets. Candidate mode requires IndependentGraph != off; source-only mode pairs it with
; SourceTimeline=on and an F7 window (window-open + equipment settles). No pose sampling,
; no graph write/advance.
ClipIdentityCensus=false
; C-G5-CAL K2-C1 equipment state dump (default off): appends a read-only worn-armor
; snapshot `armor=slots=31 worn=N <slot>:<formid>,...` to every ANIMATION WORLD row.
; Enumerates every BipedObjectSlot mask bit via Actor::GetWornArmor (31 slots, kFX01
; included). No graph write, no hook, no pose sampling. With the key off the rows are
; byte-identical to the historical format.
EquipmentStateDump=false
; C-G5-CAL K5 (K6 plan section 10, default off): switch the per-generation candidate
; snapshot (and the per-apply source snapshot under SamplingLiveness) to the CPK5
; format v1, adding per-clip resource identity columns (stable-id pointers, duration
; bits, data/blockOffsets/map hashes) to the K3 layout. Shares every trigger point
; and the two-read rule with ObservationSnapshot; when both keys are on the K3 writer
; is suppressed with a logged declaration row. With the key off the output is
; byte-identical to the historical behaviour.
K5FullSample=false
; C-G5-CAL K5 layer audit (default off): at the four pre-registered audit points
; (post-activate, equip mid, equip settle, unequip complete) walk the candidate's
; active-node list, classify every node by exact vtable match and log one K5 LAYER
; row per node plus one K5 AUDIT summary row. Read-only: no graph write, no
; advancement, no pose sampling.
K5LayerAudit=false
; C-G5-CAL K5 reconciliation (default off): emit the K5 RECON row and the JSON
; ledger artifact when the source-side F7 window closes. The candidate side always
; reconciles when K5FullSample is on, so this key only governs the source window.
K5Reconciliation=false
; C-G5-SETUP v1 (default off): one-shot read-only setup/skeleton audit after the
; candidate loads and before activation. Logs source/candidate setup, skeleton and
; data pointers, bone counts and the reference-pose transforms for twelve fixed
; bones (root, COM, Weapon, Pauldrons, five static attachment nodes, Look/Neck).
; Writes no pose/graph state, installs no hook and calls no update/event entry.
SetupAudit=false
; C-G5-TRANS v1 (default off): read-only transition/blender state probe at the
; existing K5 candidate/source points. Records state-machine activeTransitions
; (0x28 stride) and Blender blendParameter/endIntervalWeight/child weights; no
; writes, no new hooks, and requires K5FullSample.
TransitionStateProbe=false
; C-G5-TRANS v5 (default off): candidate-only read-only follow of
; hkbBehaviorReferenceGenerator::behavior (+0x50) into the referenced hkbBehaviorGraph,
; then enumerate activeNodes and log the State3 Blender weights. Requires
; TransitionStateProbe and K5FullSample; no writes, no new hooks, no source ring.
TransitionSubgraphProbe=false
; C-G5-TRANS v6: candidate equipment parent chain at pre/post sample, steps 1-13.
; Requires AE 1.6.1170, TransitionStateProbe=true and K5FullSample=true.
TransitionParentChainProbe=false
; C-G5-CHAIN v1: idle-settle three-way comparison at the two F7 display checkpoints
; (call 60/120) - each side's poseLocal against a direct SamplePartialTracks of that
; side's active clip at that side's own localTime, plus a bounded active-node census
; of both graphs. Read-only.
; Requires AE 1.6.1170 and IndependentGraph=inject (the F7 display path).
IdleChainProbe=false
; C-WORLD v1: sample the source actor's Smooth phase markers (mag_start on /
; mag_loop on) from the per-frame hook, at most one row per 250 ms, whether or not
; the panel is open. Read-only; answers whether normal play ever clears
; mag_start on. Contract: docs/diagnostics/world-phase-probe-contract-20261125/
WorldPhaseProbe=false
; C-G6 v1: one bounded lifecycle ledger row at every session/save boundary
; (G6 LEDGER phase=...) - process-wide counters only: parked-graph total
; (exception E2), retained-candidate state (exception E1), DAC world/sessions,
; panel revision/open. Read-only; no writes, no hooks. Boundary phases:
; panel-close / lifetime-replace / controller-reset on session rebuilds,
; preload-game / newgame after the invalidation chain. Restart after changing.
G6Ledger=false
; C-G6-CON v1: CON-A domain sync. Reads the ten pre-registered driver words
; (iState/currentDefaultState/iRightHandEquipped/iLeftHandEquipped/iMagicEquipped/
; bMLh_Ready/bMRh_Ready/bIsInMT/iRightHandType/iLeftHandType) from the SOURCE and,
; when their signature changes or on the first bind of a display window, writes
; them into the CANDIDATE's own variable set through the typed setters (C-G5-CAL
; D2 path). The source is never written; a failing variable stops for the
; process; the whole sync disables itself after 32 events. Rows: G6 SYNC ARM /
; G6 SYNC. Requires IndependentGraph=inject. Restart after changing.
CandidateDomainSync=false
; C-G6-CON v2/v3: CON-A' directional dispatch. On a domain switch the direction
; rule reads the (candidate, source) pair of currentDefaultState (0 sheathed /
; 1 drawn 1HM / 2 magic-ready; the ~0.6 s equip transient 11 never dispatches),
; primes the ten sync variables and then dispatches the pre-registered event into
; the CANDIDATE via the engine's event dispatch entry: sheathed->drawn =
; WeapEquip, ->sheathed = Unequip (144), drawn->magic = MagicForceEquipRight (476),
; magic->drawn = WeapOutRightReplaceForceEquip (417). Equal domains and
; unevidenced pairs prime only. Event ids resolve on the candidate's own table;
; an unresolved name stops that direction for the process. Requires
; CandidateDomainSync=true; rows carry direction=/dispatch= on G6 SYNC.
; Restart after changing.
CandidateDomainDispatch=false
