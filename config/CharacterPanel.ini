[Animation]
; non_combat_loop (default) or mt_idle. Restart the game after changing.
UnarmedIdle=non_combat_loop

[Diagnostics]
; Opt-in correlated OAR/load/DAC/capture/mount and pose evidence. Restart after changing.
; Pose limit: 4 windows / 24 snapshots per request; fixed source bones once per request.
DetailedAnimationTrace=false
; Independent opt-in source graph identities/counts only; no graph creation or drive.
; At most 16 grouped lines per actor/request. Restart after changing.
BehaviorGraphProbe=false

[Experiment]
; off (default), construct (empty shell), load (shell plus native project load),
; drive (G2: load plus one engine activation and 120 fixed 1/60 s updates),
; inject (drive plus a pre-registered event dispatch through the engine's own
; event-triggered-transition entry before the first pipeline step).
; Independent-graph experiment: runs once per process on the first panel open.
; Restart after changing.
IndependentGraph=off
; v27 (default off): when on and a candidate is retained, the panel applies that candidate's
; poseLocal instead of the OAR clip sampler. DisplayStep=false keeps the final driven pose.
DisplayPose=false
; Opt-in AE 1.6.1170 inject: elapsed 60 Hz scheduling of shared fixed 1/60 s steps.
; Each display call counts at most 100 ms / 6 steps; excess stall time is discarded,
; fractional time is retained, and zero-due calls keep the current stepped-mode pose.
; Requires DisplayPose=true and the same source generation/controller owner. Stale views use OAR;
; other ineligible steps may keep that valid source's frozen pose. Request/retarget/rejection
; and ineligible/frozen fallback reset pacing; F8-only gaps use the bounded stall rule.
; Restart after changing.
DisplayStep=false
; G3-A (default off): outside the panel F7 requests a fresh 20-second / 800-line window,
; resetting its baseline, settle state and budget. Inside the panel F7 still recaptures.
; Only settled word-variable and active-node count changes are logged, read-only.
; Source loss/replacement or PreLoadGame/NewGame cancels the window; explicitly F7 again
; after the source is ready. Detected source changes abort instead of auto-rebasing.
SourceTimeline=false
; C-G3B-E3 (default off): transient mode for the source timeline. When on with
; SourceTimeline, BOOL/INT-typed variables log every observed word change immediately
; (no settle rule), catching one-frame command writes the settle-3 rule filters out;
; REAL/quad types keep settle-3. Requires SourceTimeline=true and IndependentGraph=off.
SourceTransientWatch=false
; C-G3B-E1 / C-G4-C1 (default off): read-only observer on the engine's event dispatch
; entry 58377. Three states: off | on | concurrent (on/true keep the old boolean meaning).
; `on`: outside the panel F7 opens a 20-second window that logs every event the source
; graph receives (id, resolved name, payload null/set) plus settled changes of the five
; equipment-chain phase variables and the node count. Requires IndependentGraph=off.
; `concurrent`: the window is armed by the candidate experiment itself (before its own
; WeapEquip/Unequip dispatches) and closed by the first stepped display close, the
; 20-second expiry or a world reset; it may run beside IndependentGraph=inject. Both
; states require SourceTimeline=off (the timeline wins and this hook is then not
; installed). The detour is installed once per process at startup only when the runtime
; head bytes match the pre-registered seven bytes; a mismatch logs the observed bytes and
; installs nothing. Budgets: 600 event lines and 200 phase lines per window; either
; exhausting closes it. The close row carries calls/other-graph/ring-dropped: the two
; dispatches of a replay make calls>=2 the liveness control, and source events must be 0.
SourceEventCapture=off
; C-G3B-E2 (default off): read-only observers on the typed graph setters (Bool 63607 /
; Int 63609). Outside the panel F7 opens a 20-second window that logs every setter write
; to any of the player's graphs (kind, resolved name, value) plus the settled phase
; variables. Requires IndependentGraph=off; wins only when both other source instruments
; are off. Head bytes are verified at startup; a mismatch installs nothing. Budgets:
; 300 write lines and 200 phase lines per window.
SourceWriteCapture=false
; C-VC1 (default off): one-shot read-only census of the candidate's behaviour-graph variable
; table (index, m_type, role, flags, name, current word, initial value, bounds), the source's
; same table, and a by-name alignment of the two. Requires IndependentGraph != off; runs once
; per process after the candidate loads. Writes nothing, adds no hook and calls no native code.
; The name/type table is bounded by the type table (<= 8192 entries); slot indices are not
; comparable between projects, so only names pair the two sides.
CandidateVariableCensus=false
; C-G3B-S1 (default off): after the candidate activates, write iRightHandEquipped=1 once through
; the graph's own SetGraphVariableInt (CommonLib member, no new REL entry) and sample iState /
; currentDefaultState / the node count at steps 0/1/2/6/60/120. Requires IndependentGraph=drive
; or inject. One write and one probe per process; a failed setter is logged and never retried or
; replaced with a direct word write.
CandidateInputProbe=false
; C-G3B-S2: which single variable the probe writes, and the integer value it writes. The setter
; follows the variable's own m_type (BOOL -> bool setter, INT8/16/32 -> int setter); REAL, pointer
; and quad-sized targets are skipped rather than written lossily. Leave the name empty to run the
; probe as observation only (no write) — that is how an event-only run such as inject is judged.
CandidateInputVariable=IsEquipping
CandidateInputValue=1
; C-G3B-S1 (default off): drive mode only runs the engine's generation entry when this is on.
; Without it the batch drives 120 steps on a graph that never generates (children-flag=0, all
; pose hashes equal), so a static candidate cannot judge any input. inject mode implies the entry.
CandidateGenerationEntry=false
; C-G3B-S3 (default off): once the equip phase settles (currentDefaultState==1 held for three
; consecutive samples inside the first 120 driven steps), dispatch 1HM_Unequip once through the
; same event resolve+dispatch path as the activation injection and sample the unequip phase for
; another 121 steps (0-119 plus a final 120). Requires IndependentGraph=inject. One full sequence
; per process; a no-settle window or a missing event name ends the run instead of retrying or
; upgrading to a timed injection. No variable is written.
CandidateUnequipProbe=false
; C-G3B-S4: the unequip slice's second-stage input. Non-empty swaps the second stage from the
; S3 event dispatch to one typed by-name variable write at the settle point (the pre-registered
; ladder bEquipUnequip -> IsUnequipping -> PitchManualOverride, one INI-only round per name);
; empty keeps the 1HM_Unequip dispatch. Requires CandidateUnequipProbe=true and inject.
CandidateUnequipVariable=
; C-G3B-S5: an optional prime write before the unequip command. Non-empty writes this
; variable (typed by m_type, value 1) first at the settle point, then the
; CandidateUnequipVariable command — the pre-registered pair is
; CandidateUnequipPrime=iRightHandEquipped + CandidateUnequipVariable=bEquipUnequip
; (the real sequence: equipped state, then the unequip command). Empty keeps the S4
; single-write behaviour. Either name missing or type unsupported skips the window.
CandidateUnequipPrime=
; C-G3B-S6: the unequip slice's second-stage EVENT name (used only when
; CandidateUnequipVariable is empty). The C-G3B-A1 audit resolved the equipped-idle 1->12
; transition to this event (condition disabled, no time window); S3's 1HM_Unequip failed
; because that name is not any Default_State transition's event. Empty keeps the S3
; legacy name. Requires CandidateUnequipProbe=true and inject.
CandidateUnequipEvent=
; C-G4-A: while native candidate activity is armed (experiment drive windows, display
; stepping, pre-registered event dispatches), count OAR condition-evaluation detour hits
; against the candidate window and emit OAR CONTEXT rows plus the display-branch
; suppression row. Default off; restart after changing.
OarContextWatch=false
